name: Build Android APK
on:
  # APK generation is intentionally manual; ordinary source commits never publish an APK.
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node.js for the bundled Android runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Stage Node.js ARM64 runtime and backend dependencies
        run: bash scripts/prepare-android-runtime.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFK-Bot-Mine-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: AFK Bot Mine V2 Android v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

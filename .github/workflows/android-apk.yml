name: Build Android APK
on:
  # Build the APK only for this explicitly requested packaging branch or manually.
  push:
    branches:
      - fix/android-runtime-packaging
    paths:
      - ".github/workflows/android-apk.yml"
      - "app/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "runtime/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node.js for the bundled Android runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Stage Node.js ARM64 runtime and backend dependencies
        run: bash scripts/prepare-android-runtime.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFK-Bot-Mine-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
